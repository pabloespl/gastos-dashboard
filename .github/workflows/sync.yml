name: Sync Google Sheets → Supabase

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Qué flujo sincronizar'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - transactions
          - transfers

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Token con permisos de escritura para hacer push de los archivos de cursor
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run transactions sync
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'transactions' || github.event.inputs.target == '' }}
        env:
          CI: 'true'
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync-transactions.js

      - name: Run bank transfers sync
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'transfers' || github.event.inputs.target == '' }}
        env:
          CI: 'true'
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync-transfers.js

      - name: Commit archivos de cursor si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_sync_transactions.txt last_sync_transfers.txt
          if git diff --staged --quiet; then
            echo "Sin cambios en los archivos de cursor, nada que commitear."
          else
            git commit -m "chore: sync $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi